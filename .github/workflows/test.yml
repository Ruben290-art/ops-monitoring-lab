name: Test monitoring lab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python files
        run: python -m compileall -q app monitoring tests

      - name: Validate Ansible YAML syntax
        run: |
          python -m pip install --disable-pip-version-check ansible-core
          cd ansible
          ansible-playbook -i inventory/local.ini site.yml --syntax-check

